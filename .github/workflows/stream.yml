name: FB Live Virtual Screen Capture Final

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool

      - name: Start Live Stream Setup
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          # Updated Facebook Video Link:
          TARGET_URL: "https://www.facebook.com/khel.np9/videos/27506206312389280/"
        run: |
          # 1. Start Virtual Display :99 (1280x720 24bit)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 3

          # 2. Launch Chromium in Kiosk mode
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "${TARGET_URL}" &
          
          sleep 6
          xdotool key Escape
          sleep 6

          # 3. Capture Video, Crop exact player area, scale to HD fullscreen & stream
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
          -filter_complex "[0:v]crop=840:480:15:95,scale=1280:720,eq=brightness=0.04:contrast=1.1:saturation=1.15,drawtext=text='LIVE STREAM':x='(w-text_w)/2+70*sin(t)':y='(h-text_h)/2+30*cos(t)':fontsize=26:fontcolor=white@0.4:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf[vout]" \
          -map "[vout]" -map 1:a \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -g 60 -r 30 -c:a aac -b:a 64k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

name: Stream Touchcric Match to Facebook (Ultra Stable)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl
          npm install puppeteer

          # Background music eka download karaganeema
          curl -L -o bgmusic.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"

      - name: Start Virtual Display & Launch Puppeteer
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Ads nisa aluthen open wena tabs block kirima
            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            // Match Page Link
            await page.goto('https://footfytv.pro/watch/4527', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            // Tapmad server button click & fullscreen
            await page.evaluate(async () => {
              window.open = function() { return null; };

              const buttons = Array.from(document.querySelectorAll('button, a, div.server-item, span'));
              const tapmadBtn = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('tapmad'));
              
              if (tapmadBtn) {
                tapmadBtn.click();
              }

              await new Promise(resolve => setTimeout(resolve, 3000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 18

          # වැරදි ඉන්පුට් නැති පිරිසිදු Stable FFmpeg Command එක
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -stream_loop -1 -i bgmusic.mp3 \
            -map_metadata -1 \
            -filter_complex "[0:v]scale=1280:720,tblend=all_mode=average,eq=brightness=0.08:contrast=1.80:saturation=1.40:gamma=1.30,hue=h=45:s=1.4,noise=alls=30:allf=t+u,unsharp=11:11:1.2:9:9:0.8,fps=30,setpts=0.998*PTS,drawtext=text=' SPORT RANUWA ':x=w-tw-25:y=25:fontsize=36:fontcolor=white:box=1:boxcolor=red@0.9:boxborderw=15,drawtext=text=' LIVE CRICKET STREAM 24/7 ':x='mod(t*55, w+200)-100':y=h-35:fontsize=20:fontcolor=white@0.95:box=1:boxcolor=black@0.8:boxborderw=4[v]; [1:a]asetrate=44100*0.68,aresample=44100,equalizer=f=300:width_type=h:width=1000:g=-40,equalizer=f=6000:width_type=h:width=1000:g=-35,aecho=0.8:0.88:60:0.4,volume=0.02[main_audio]; [2:a]volume=0.01[bg_audio]; [main_audio][bg_audio]amix=inputs=2:duration=first[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 1800k -maxrate 2200k -bufsize 4400k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -flvflags no_duration_filesize+no_metadata \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
            

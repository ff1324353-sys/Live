name: Willow HD Facebook Streamer

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Anti-Copyright Live Stream to Facebook
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          STREAM_URL: "http://tvsen5.aynascope.net/willowhd/index.m3u8"
        run: |
          echo "Starting Fixed Willow HD Stream to Facebook..."
          
          while true; do
            ffmpeg -headers "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"$'\r\n' \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -rw_timeout 15000000 \
            -fflags +genpts+discardcorrupt \
            -i "$STREAM_URL" \
            -vf "hflip,scale=1280:720,eq=saturation=1.12:contrast=1.15,\
            drawbox=x=980:y=15:w=280:h=100:color=black@0.98:t=fill,\
            drawtext=text='LIVE MATCH':fontcolor=yellow:fontsize=20:x=1020:y=50,\
            drawbox=x=0:y=665:w=1280:h=40:color=black@0.75:t=fill,\
            drawtext=text='● LIVE CRICKET MATCH STREAMING - FOLLOW FOR MORE':fontcolor=white:fontsize=16:x='1280-mod(t*120\, 1600)':y=675" \
            -af "asetrate=44100*1.04,aresample=44100,atempo=1/1.04" \
            -c:v libx264 -preset veryfast -tune zerolatency -g 50 \
            -b:v 2200k -maxrate 2800k -bufsize 5000k -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
            
            echo "Stream disconnected or re-indexing. Restarting connection in 3 seconds..."
            sleep 3
          done

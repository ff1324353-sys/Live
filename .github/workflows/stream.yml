name: FB Live Virtual Screen Capture Test

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio

      - name: Start Live Stream Setup
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          # Target Page / Stream URL:
          TARGET_URL: "https://www.facebook.com/tvwanonline24/videos/1032528446511160/"
        run: |
          # 1. Start Virtual Display :99 (1280x720 24bit)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 3

          # 2. Launch Chromium with flags to skip First-Run, Terms & Welcome Dialogs
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-features=Translate \
            --autoplay-policy=no-user-gesture-required \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "${TARGET_URL}" &
          
          # Browser එක Load වී Video එක Play වීමට තත්පර 12ක් Wait කිරීම
          sleep 12

          # 3. Capture Virtual Screen & Audio, apply filters and stream to FB Live
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
          -filter_complex "[0:v]eq=brightness=0.05:contrast=1.12:saturation=1.2,scale=1280:720,drawtext=text='TEST STREAM LIVE':x='(w-text_w)/2+80*sin(t)':y='(h-text_h)/2+40*cos(t)':fontsize=28:fontcolor=white@0.5:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf[vout]" \
          -map "[vout]" -map 1:a \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -g 60 -r 30 -c:a aac -b:a 64k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

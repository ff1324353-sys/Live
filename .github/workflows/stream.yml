name: Optimized FFmpeg Video Processing Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Audio Resources
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          curl -L -o crowd_noise.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Execute FFmpeg Stream
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          ffmpeg -y \
            -rw_timeout 15000000 \
            -re -i "https://tvsen5.aynascope.net/willowhd/index.m3u8" \
            -stream_loop -1 -i crowd_noise.mp3 \
            -filter_complex \
            "[0:v]crop=iw*0.86:ih*0.86:iw*0.07:ih*0.07, \
             scale=1272:718, \
             rotate=0.008, \
             fps=25, \
             noise=alls=2:allf=t+u, \
             eq=brightness=0.05:contrast=1.3:saturation=1.4:gamma=1.1, \
             colorbalance=rs=0.04:gs=-0.02:bs=0.06, \
             vignette='PI/4 + sin(t/2)*0.05', \
             unsharp=5:5:1.0:5:5:0.0, \
             drawbox=x=0:y=0:w=iw:h=18:color=black@1.0:t=fill, \
             drawbox=x=0:y=ih-18:w=iw:h=18:color=black@1.0:t=fill, \
             drawbox=x=900:y=15:w=360:h=90:color=black@0.95:t=fill, \
             drawbox=x=900:y=15:w=360:h=90:color=gold@1.0:t=4, \
             drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='RANU JR LIVE':x=920:y=42:fontsize=32:fontcolor=white:enable='gt(mod(t,10),3)', \
             drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MATCH UPDATES':x='(w-tw)/2':y='h-th-25':fontsize=24:fontcolor=yellow@0.9:box=1:boxcolor=black@0.8:boxborderw=8[v]; \
             [0:a]highpass=f=100,lowpass=f=14000,asetrate=44100*0.95,atempo=1.01,pan=stereo|c0=0.9*c0+0.1*c1|c1=0.1*c0+0.9*c1,volume=0.85,equalizer=f=1000:width_type=h:width=200:g=-3[main_audio]; \
             [1:a]volume=0.15[bg_audio]; \
             [main_audio][bg_audio]amix=inputs=2:duration=first,aecho=0.8:0.88:50:0.2[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset superfast -pix_fmt yuv420p -g 50 -b:v 1800k -maxrate 2000k -bufsize 4000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

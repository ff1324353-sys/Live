name: Stream Touchcric Match to YouTube via Chromium Capture

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Download Background Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core
          npm install puppeteer
          
          # Background music for copyright protection
          curl -L -o bgmusic.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Start Virtual Display & Launch Puppeteer
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Block new popup tabs from ads
            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            // Pakistan vs England Match Page Link
            await page.goto('https://new.touchcric.com/watch-pakistan-vs-england-tri-series-4th-match-live-cricket-streaming.htm', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            // Auto-play without clicking and unmute
            await page.evaluate(() => {
              window.open = function() { return null; };

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 12

          # FFmpeg Video Crop (700x410), Filters, Audio Mix & YouTube RTMP Output (Logo Moved Down: y=50)
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -stream_loop -1 -i bgmusic.mp3 \
            -filter_complex "[0:v]crop=700:410:290:170,scale=1280:720,eq=brightness=0.05:contrast=1.35:saturation=1.6:gamma=1.3,drawtext=text=' RANUWA LIVE ':x=w-tw-10:y=50:fontsize=36:fontcolor=white:box=1:boxcolor=black@1.0:boxborderw=25[v]; [1:a]asetrate=44100*0.93,aresample=44100,volume=0.85[main_audio]; [2:a]volume=0.12[bg_audio]; [main_audio][bg_audio]amix=inputs=2:duration=first[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/94xy-uqh4-g9hq-gxbz-2hza"
            

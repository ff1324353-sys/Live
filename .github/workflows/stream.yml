name: Facebook Live Stream via yt-dlp OAuth2

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg & Latest yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Stream YouTube Live directly to Facebook with OAuth2
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          YOUTUBE_URL="https://www.youtube.com/watch?v=n3qodO8ER_4"

          # Use OAuth2 authentication (--username oauth2 --password '')
          # Note: The first time you run this, check the GitHub Actions logs for the device login code and URL to authorize!
          yt-dlp --js-runtimes node \
            --username oauth2 --password '' \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            -g "$YOUTUBE_URL" | {
            read -r VIDEO_URL
            read -r AUDIO_URL || AUDIO_URL="$VIDEO_URL"

            ffmpeg -re -i "$VIDEO_URL" -i "$AUDIO_URL" \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.03:saturation=1.1,drawtext=text='RANUWA LIVE':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=8[v]; [1:a]asetrate=44100*1.01,aresample=44100[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
          }
          

name: YouTube Live Streamer

on:
  workflow_dispatch: # අපිට ඕන වෙලාවකට Manual එකෙන් Run කරන්න පුළුවන් වෙන්න

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Live Stream to YouTube
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
        run: |
          echo "Starting FFmpeg Live Stream..."
          
          ffmpeg -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
          -fflags +discardcorrupt+genpts -probesize 15M -analyzeduration 5M \
          -i "https://s1.itcnbd.live/T-Sports-HD/tracks-v1a1/mono.m3u8" \
          -vf "fps=25,scale=1280:720,crop=in_w-16:in_h-16:8:8,eq=saturation=1.15:brightness=0.02,noise=alls=8:allf=t+u,drawbox=x=iw-w-15:y=10:w=320:h=150:color=black@0.9:t=fill" \
          -af "treble=g=3,bass=g=-2,aresample=async=1:min_hard_comp=0.100000:first_pts=0" \
          -c:v libx264 -preset ultrafast -tune zerolatency -fps_mode cfr -g 50 \
          -b:v 700k -maxrate 700k -bufsize 1400k -pix_fmt yuv420p \
          -c:a aac -b:a 96k -ar 44100 -ac 2 -max_muxing_queue_size 99999 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_KEY"

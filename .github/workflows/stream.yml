name: FB Live Streamer

on:
  workflow_dispatch:
    inputs:
      fb_url:
        description: 'Facebook Live Video Link එක මෙතනට Paste කරන්න'
        required: true
        default: ''

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools (FFmpeg & yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install -U --break-system-packages yt-dlp

      - name: Extract and Stream to Facebook Live
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          FB_URL: ${{ github.event.inputs.fb_url }}
        run: |
          echo "Facebook Link එකෙන් Video Stream එක ලබා ගැනීමට උත්සාහ කරයි..."
          
          while true; do
            # yt-dlp මගින් FB Link එකෙන් Direct Video Stream URL එක ලබා ගැනීම
            STREAM_URL=$(yt-dlp -g --format "best[vcodec^=avc1]/best" "$FB_URL" 2>/dev/null || true)
            
            if [ -z "$STREAM_URL" ]; then
              echo "Link එක Extraction Error එකක් ආවා හෝ Stream එක Active නැත. තත්පර 10කින් නැවත උත්සාහ කරයි..."
              sleep 10
              continue
            fi

            echo "Stream URL එක ලැබුණා! Facebook එකට Stream වීම ආරම්භ වේ..."
            
            # FFmpeg හරහා ඔයාගේ Facebook Page එකට Re-stream කිරීම
            ffmpeg -headers "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -rw_timeout 15000000 \
            -i "$STREAM_URL" \
            -vf "hflip,scale=1280:720,eq=saturation=1.12:contrast=1.18,\
            drawbox=x=0:y=665:w=1280:h=40:color=black@0.7:t=fill,\
            drawtext=text='● LIVE MATCH STREAMING':fontcolor=white:fontsize=16:x='1280-mod(t*120\, 1600)':y=675" \
            -c:v libx264 -preset veryfast -tune zerolatency -g 50 \
            -b:v 2200k -maxrate 2800k -bufsize 5000k -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
            
            echo "Stream එක Disconnect වුණා. නැවත Reconnect වේ..."
            sleep 3
          done

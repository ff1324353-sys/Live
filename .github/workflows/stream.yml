name: Facebook Live Stream via Cookies & Chromium Capture

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            chromium-browser \
            xvfb \
            pulseaudio \
            alsa-utils \
            xdotool \
            fonts-dejavu-core

      - name: Setup Profile & Inject Cookies
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          mkdir -p /tmp/chrome-profile
          # Save cookies to a file temporarily
          printf "%s\n" "$FB_COOKIES" > /tmp/cookies.txt

      - name: Start Virtual Display & Stream to Facebook
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          # Write cookies again for runtime
          printf "%s\n" "$FB_COOKIES" > /tmp/cookies.txt

          # 1. Start Virtual Framebuffer
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          # 2. Open Chromium with custom flags
          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --user-data-dir=/tmp/chrome-profile \
            --window-size=1280,720 \
            --no-first-run \
            --no-default-browser-check \
            --autoplay-policy=no-user-gesture-required \
            --start-fullscreen \
            --kiosk "https://www.facebook.com/100095151165633/videos/1101080645849720/?mibextid=rS40aB7S9Ucbxw6v" > /dev/null 2>&1 &

          # Wait for browser to load page with cookies
          sleep 12

          # Auto click center to trigger play
          xdotool mousemove 640 360 click 1
          sleep 3

          # 3. Stream to Facebook Live with Anti-Copyright Filters
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.03:saturation=1.1,drawtext=text='RANUWA LIVE':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=8[v]; [1:a]asetrate=44100*1.01,aresample=44100[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
            

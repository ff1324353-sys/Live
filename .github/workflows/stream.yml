name: Facebook Live Stream via Invidious Screen Capture

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils jq python3-pip
          pip3 install websocket-client

      - name: Start Live Stream Setup
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          # 1. Start Virtual Display & Audio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1 || true
          sleep 3

          # 2. Launch Chromium with Invidious Embed Link (Bypasses Sign-in & Bot block)
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --mute-audio=false \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "https://yewtu.be/embed/n3qodO8ER_4?autoplay=1" &
          
          sleep 12
          xdotool key Escape
          sleep 2
          
          # 3. Inject JS to Unmute & Force Play Video
          python3 -c '
          import urllib.request, json, time, websocket
          time.sleep(3)
          try:
              response = urllib.request.urlopen("http://localhost:9222/json")
              targets = json.loads(response.read().decode())
              ws_url = None
              for t in targets:
                  ws_url = t.get("webSocketDebuggerUrl")
                  break
              if ws_url:
                  ws = websocket.create_connection(ws_url)
                  js_code = """
                  const video = document.querySelector("video");
                  if (video) {
                      video.muted = false;
                      video.volume = 1.0;
                      video.play().catch(e => console.log(e));
                  }
                  """
                  msg = json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": js_code}})
                  ws.send(msg)
                  ws.close()
                  print("Invidious Stream Ready!")
          except Exception as e:
              print("JS error:", e)
          ' || true

          sleep 5

          # 4. Capture Screen with FFmpeg & Stream to Facebook
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f pulse -i default \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -flvflags no_duration_filesize \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
          

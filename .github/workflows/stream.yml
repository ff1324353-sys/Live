name: YouTube Live Streamer

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Dynamic Anti-Copyright Live Stream to YouTube
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
        run: |
          echo "Starting Advanced FFmpeg Live Stream..."
          
          ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
          -fflags +discardcorrupt+genpts -probesize 100M -analyzeduration 50M \
          -i "https://tvsen6.aynaott.com/zv68oqPDu7MZZwmHhRxt/tracks-v1a1/mono.ts.m3u8" \
          -vf "scale=1280:720,eq=saturation=1.12:contrast=1.18,\
          drawbox=x=1060:y=15:w=300:h=160:color=black@0.98:t=fill,\
          drawtext=text='LIVE_24_7':fontcolor=yellow:fontsize=18:x=1100:y=40,\
          drawbox=x=0:y=665:w=1280:h=40:color=black@0.7:t=fill,\
          drawtext=text='● LIVE CRICKET MATCH STREAMING - ENJOY THE GAME':fontcolor=white:fontsize=16:x='1280-mod(t*120\, 1600)':y=675" \
          -af "volume=0" \
          -c:v libx264 -preset veryfast -tune zerolatency -fps_mode cfr -g 60 \
          -b:v 2500k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_KEY"

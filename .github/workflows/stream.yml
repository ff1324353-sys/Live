name: YT Restream Playwright Stealth

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Node & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: Start Playwright Browser & Restream
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          TARGET_URL: "https://www.youtube.com/watch?v=pMfYTkk4YRg"
        run: |
          # 1. Start Virtual Display & Audio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1
          sleep 3

          # 2. Launch Stealth Playwright Node Script
          node -e '
          const { chromium } = require("playwright-extra");
          const stealth = require("puppeteer-extra-plugin-stealth")();
          chromium.use(stealth);

          (async () => {
            const browser = await chromium.launch({
              headless: false,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--autoplay-policy=no-user-gesture-required",
                "--window-size=1280,720"
              ]
            });
            const page = await browser.newPage();
            await page.setViewportSize({ width: 1280, height: 720 });
            await page.goto(process.env.TARGET_URL, { waitUntil: "domcontentloaded" });
            
            // Wait for player to load
            await page.waitForTimeout(8000);
            
            // Unmute & Play
            await page.evaluate(() => {
              const v = document.querySelector("video");
              if (v) { v.muted = false; v.volume = 1.0; v.play(); }
            });

            // Keep browser alive
            await new Promise(() => {});
          })();
          ' &

          sleep 12
          
          # Toggle Fullscreen view
          xdotool key f
          sleep 3

          # 3. Capture Screen & Stream to FB Live
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f pulse -i default \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -g 60 -r 30 -c:a aac -b:a 128k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
          

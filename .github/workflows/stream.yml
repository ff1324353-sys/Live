name: Telegram Live Stream Bot

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils jq python3-pip
          pip3 install websocket-client

      - name: Start Live Stream Setup
        run: |
          # 1. Start Virtual Display & PulseAudio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1
          sleep 3

          # 2. Launch Chromium with xHamsterLive URL
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --mute-audio=false \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "https://xhamsterlive.com/x__queen_SL" &
          
          # Wait for page load and clear blocks/popups
          sleep 12
          xdotool key Escape
          sleep 2
          
          # 3. Inject JavaScript to play and unmute video automatically
          python3 -c '
          import urllib.request, json, time, websocket
          time.sleep(3)
          try:
              response = urllib.request.urlopen("http://localhost:9222/json")
              targets = json.loads(response.read().decode())
              ws_url = None
              for t in targets:
                  ws_url = t.get("webSocketDebuggerUrl")
                  break
              if ws_url:
                  ws = websocket.create_connection(ws_url)
                  js_code = """
                  const overlays = document.querySelectorAll("div[role=\\x27dialog\\x27], div[class*=\\x27modal\\x27], div[class*=\\x27overlay\\x27]");
                  overlays.forEach(el => el.remove());
                  
                  document.querySelectorAll("video").forEach(v => {
                      v.muted = false;
                      v.volume = 1.0;
                      v.play().catch(err => console.log(err));
                  });
                  """
                  msg = json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": js_code}})
                  ws.send(msg)
                  ws.close()
                  print("JS unmuted and played successfully!")
          except Exception as e:
              print("JS error:", e)
          ' || true

          sleep 4

          # 4. Capture Screen & PulseAudio Stream and Push to Telegram Live RTMP
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f pulse -i default \
          -c:v libx264 -preset veryfast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -f flv "rtmps://dc5-1.rtmp.t.me/s/5471975795:vXuLHRfeef_dt6l9Oh6YPw"
          

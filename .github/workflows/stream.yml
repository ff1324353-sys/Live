name: FB Live VPN Stream Fixed

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser, OpenVPN & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils jq python3-pip openvpn curl
          pip3 install websocket-client

      - name: Connect to Free VPN (Auto Region / Asia)
        run: |
          echo "Fetching free OpenVPN server from VPN Gate..."
          curl -s "https://www.vpngate.net/api/iphone/" > vpngate.csv
          
          PYTHON_SCRIPT=$(cat << 'EOF'
          import base64
          with open("vpngate.csv", "r", encoding="latin-1") as f:
              lines = f.readlines()
          for line in lines[2:]:
              parts = line.strip().split(",")
              if len(parts) > 14:
                  b64_data = parts[14].strip()
                  if b64_data:
                      try:
                          missing_padding = len(b64_data) % 4
                          if missing_padding:
                              b64_data += '=' * (4 - missing_padding)
                          decoded = base64.b64decode(b64_data).decode("utf-8", errors="ignore")
                          if "client" in decoded and "dev tun" in decoded:
                              with open("vpn.ovpn", "w") as out:
                                  out.write(decoded)
                              print("Successfully extracted VPN config!")
                              exit(0)
                      except Exception as e:
                          continue
          print("Failed to extract config")
          exit(1)
          EOF
          )
          
          python3 -c "$PYTHON_SCRIPT"
          
          if [ -f vpn.ovpn ]; then
            echo "Starting OpenVPN connection in background..."
            # Run without --daemon so we can log or continue safely, using nohup & timeout
            sudo openvpn --config vpn.ovpn --auth-nocache &
            
            echo "Waiting for VPN tunnel to establish..."
            # Wait up to 15 seconds for tun0 interface to appear
            for i in {1..15}; do
              if ip addr show dev tun0 2>/dev/null | grep -q "inet"; then
                echo "VPN Tunnel is UP!"
                break
              fi
              sleep 1
            done
            
            echo "Current Public IP:"
            curl --max-time 5 ifconfig.me || true
            echo ""
          else
            echo "VPN config extraction failed, proceeding without VPN..."
          fi

      - name: Start Live Stream Setup
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          TARGET_URL: "https://www.facebook.com/61582413664556/videos/867494799719403/?mibextid=rS40aB7S9Ucbxw6v"
        run: |
          # 1. Start Virtual Display & PulseAudio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1
          sleep 3

          # 2. Launch Chromium through the VPN connection
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --mute-audio=false \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "${TARGET_URL}" &
          
          # Wait for page load and clear blocks
          sleep 12
          xdotool key Escape
          sleep 2
          
          # 3. Inject JavaScript to remove login blocks and play/unmute video
          python3 -c '
          import urllib.request, json, time, websocket
          time.sleep(3)
          try:
              response = urllib.request.urlopen("http://localhost:9222/json")
              targets = json.loads(response.read().decode())
              ws_url = None
              for t in targets:
                  if "facebook.com" in t.get("url", ""):
                      ws_url = t.get("webSocketDebuggerUrl")
                      break
              if ws_url:
                  ws = websocket.create_connection(ws_url)
                  js_code = """
                  // Remove login dialogs and restricted overlays
                  const overlays = document.querySelectorAll("div[role=\\x27dialog\\x27], div[data-testid=\\x27royal_login_form\\x27]");
                  overlays.forEach(el => el.remove());
                  
                  // Force play and unmute all video streams
                  document.querySelectorAll("video").forEach(v => {
                      v.muted = false;
                      v.volume = 1.0;
                      v.play().catch(err => console.log(err));
                  });
                  """
                  msg = json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": js_code}})
                  ws.send(msg)
                  ws.close()
                  print("JS unmuted successfully!")
          except Exception as e:
              print("JS error:", e)
          ' || true

          sleep 4

          # 4. Capture Screen & PulseAudio Stream (Original Size & Crop)
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f pulse -i default \
          -filter_complex "[0:v]crop=790:420:18:135,scale=1280:720,drawbox=x=12:y=12:w=125:h=42:color=black@0.95:t=fill,eq=brightness=0.06:contrast=1.15:saturation=1.25:gamma=1.1,drawtext=text='LIVE STREAM':x='(w-text_w)/2+70*sin(t)':y='(h-text_h)/2+30*cos(t)':fontsize=26:fontcolor=white@0.3:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf[vout];[1:a]asetrate=44100*1.05,aresample=44100,atempo=1/1.05[aout]" \
          -map "[vout]" -map "[aout]" \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -g 60 -r 30 -c:a aac -b:a 128k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

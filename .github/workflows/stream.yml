name: Facebook Live Stream via Puppeteer (Fixed Rendering)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            chromium-browser \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core
          npm install puppeteer-core

      - name: Start Virtual Display & Launch Puppeteer
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          # 1. Start Virtual Framebuffer
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          # 2. Write Puppeteer Script
          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/chromium-browser',
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--disable-software-rasterizer',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--disable-blink-features=AutomationControlled'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Set Realistic User Agent
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');

            // Parse Netscape Cookies
            const cookieRaw = process.env.FB_COOKIES || '';
            const lines = cookieRaw.split('\n');
            const cookies = [];

            for (let line of lines) {
              line = line.trim();
              if (!line || line.startsWith('#')) continue;
              const parts = line.split('\t');
              if (parts.length >= 7) {
                cookies.push({
                  name: parts[5],
                  value: parts[6],
                  domain: parts[0].startsWith('.') ? parts[0] : '.' + parts[0],
                  path: parts[2],
                  secure: parts[3] === 'TRUE',
                  httpOnly: false
                });
              }
            }

            if (cookies.length > 0) {
              await page.setCookie(...cookies);
              console.log('Cookies injected successfully!');
            }

            // Go to FB Video Page
            await page.goto('https://www.facebook.com/100095151165633/videos/1101080645849720/', {
              waitUntil: 'networkidle2'
            });

            // Wait 8s for media player to load
            await new Promise(r => setTimeout(r, 8000));

            // Click play button or center
            await page.mouse.click(640, 360);
          })();
          EOF

          # Run Puppeteer script in background
          node launch.js > /dev/null 2>&1 &

          sleep 15

          # 3. Stream Virtual Display to FB Live
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.03:saturation=1.1,drawtext=text='RANUWA LIVE':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=8[v]; [1:a]asetrate=44100*1.01,aresample=44100[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
            

name: YT Embed Capture Restream to FB

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils jq python3-pip
          pip3 install websocket-client

      - name: Start Browser & Stream Setup
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          # Using Embed URL to bypass Chat & YouTube Bot Sign-in Overlays cleanly
          TARGET_URL: "https://www.youtube.com/embed/pMfYTkk4YRg?autoplay=1"
        run: |
          # 1. Start Virtual Display & PulseAudio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1
          sleep 3

          # 2. Launch Chromium in Fullscreen Embed Mode
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-blink-features=AutomationControlled \
            --autoplay-policy=no-user-gesture-required \
            --mute-audio=false \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "${TARGET_URL}" &
          
          sleep 8
          
          # 3. Inject JS to Unmute & Force Play Embed Video
          python3 -c '
          import urllib.request, json, time, websocket
          time.sleep(2)
          try:
              response = urllib.request.urlopen("http://localhost:9222/json")
              targets = json.loads(response.read().decode())
              ws_url = None
              for t in targets:
                  if "youtube" in t.get("url", ""):
                      ws_url = t.get("webSocketDebuggerUrl")
                      break
              if ws_url:
                  ws = websocket.create_connection(ws_url)
                  js_code = """
                  document.querySelectorAll("video").forEach(v => {
                      v.muted = false;
                      v.volume = 1.0;
                      v.play().catch(err => console.log(err));
                  });
                  """
                  msg = json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": js_code}})
                  ws.send(msg)
                  ws.close()
                  print("Embed Video Unmuted!")
          except Exception as e:
              print("JS error:", e)
          ' || true

          sleep 4

          # 4. Capture Screen & PulseAudio Stream to FB Live
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f pulse -i default \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -g 60 -r 30 -c:a aac -b:a 128k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
          

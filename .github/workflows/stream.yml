name: Telegram Live Stream Bot

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils jq python3-pip
          pip3 install websocket-client

      - name: Start Live Stream Setup
        run: |
          # 1. Start Virtual Display & Dummy Audio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1 || true
          sleep 3

          # 2. Launch Chromium
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --mute-audio=false \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "https://xhamsterlive.com/x__queen_SL" &
          
          sleep 12
          xdotool key Escape
          sleep 2
          
          # 3. Inject JS to clear overlays, click "Verify Age" and play video
          python3 -c '
          import urllib.request, json, time, websocket
          time.sleep(3)
          try:
              response = urllib.request.urlopen("http://localhost:9222/json")
              targets = json.loads(response.read().decode())
              ws_url = None
              for t in targets:
                  ws_url = t.get("webSocketDebuggerUrl")
                  break
              if ws_url:
                  ws = websocket.create_connection(ws_url)
                  js_code = """
                  // Click age verify button if exists
                  const btnList = document.querySelectorAll("button, a, div");
                  btnList.forEach(el => {
                      if (el.innerText && (el.innerText.includes("Verify Age") || el.innerText.includes("Accept") || el.innerText.includes("Confirm"))) {
                          try { el.click(); } catch(e){}
                      }
                  });

                  // Remove overlay popups
                  const removeSelectors = [
                      "div[class*=\\x27overlay\\x27]",
                      "div[class*=\\x27modal\\x27]",
                      "div[class*=\\x27backdrop\\x27]",
                      "div[class*=\\x27cookie\\x27]",
                      "div[class*=\\x27age\\x27]",
                      "div[role=\\x27dialog\\x27]"
                  ];
                  removeSelectors.forEach(sel => {
                      document.querySelectorAll(sel).forEach(el => el.remove());
                  });

                  // Play video
                  document.querySelectorAll("video").forEach(v => {
                      v.muted = false;
                      v.volume = 1.0;
                      v.play().catch(err => console.log(err));
                  });
                  """
                  msg = json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": js_code}})
                  ws.send(msg)
                  ws.close()
                  print("JS executed successfully!")
          except Exception as e:
              print("JS error:", e)
          ' || true

          sleep 4

          # 4. FFmpeg Capture with Fallback Silent Audio Generator (Prevents Exit 234 Crash)
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -flvflags no_duration_filesize \
          -f flv "rtmps://dc5-1.rtmp.t.me/s/5471975795:vXuLHRfeef_dt6l9Oh6YPw"
          

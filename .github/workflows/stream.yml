name: Stream M3U8 Cricket Match to Facebook

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Download Background Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          
          # Copyright වලින් ආරක්ෂා වීමට Background music එක ඩাউনলোড කරගැනීම
          curl -L -o bgmusic.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Start Streaming M3U8 with FFmpeg
        run: |
          # මෙතන your_m3u8_link_here කියන තැනට ඔයාගේ ඇත්තම m3u8 link එක දාන්න
          M3U8_URL="https://footfytv.pro/proxy/direct?url=http://103.16.24.4:8083/14.m3u8"

          ffmpeg -y \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$M3U8_URL" \
            -stream_loop -1 -i bgmusic.mp3 \
            -filter_complex "[0:v]crop=670:370:305:185,scale=1280:720,eq=brightness=-0.04:contrast=1.3:saturation=0.55:gamma=1.1,hue=h=15,noise=alls=10:allf=t+u,fps=30,drawtext=text=' SPORT RANUWA ':x=w-tw-20:y=20:fontsize=32:fontcolor=white:box=1:boxcolor=red@0.9:boxborderw=15[v]; [0:a]asetrate=44100*0.93,aresample=44100,equalizer=f=1200:width_type=h:width=250:g=-6,volume=0.6[main_audio]; [1:a]volume=0.4[bg_audio]; [main_audio][bg_audio]amix=inputs=2:duration=first[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
            

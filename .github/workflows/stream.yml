name: Facebook Live Stream via FB Page Capture (Geo-Bypass)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            chromium-browser \
            xvfb \
            pulseaudio \
            alsa-utils \
            xdotool \
            fonts-dejavu-core

      - name: Start Virtual Display & Stream FB Video to FB Live
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          # 1. Start Virtual Framebuffer
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          # 2. Open FB Live Video Link in Chromium
          # Flags used to disable security blocks, handle geo/autoplay & first-run setup
          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --window-size=1280,720 \
            --no-first-run \
            --no-default-browser-check \
            --autoplay-policy=no-user-gesture-required \
            --disable-web-security \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --start-fullscreen \
            --kiosk "https://www.facebook.com/100095151165633/videos/1101080645849720/?mibextid=rS40aB7S9Ucbxw6v" > /dev/null 2>&1 &

          # Wait 15 seconds for Facebook page to fully render
          sleep 15

          # Auto click center to trigger play on Facebook Player
          xdotool mousemove 640 360 click 1
          sleep 3

          # 3. Stream with Watermark & Audio Pitch Filters
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.03:saturation=1.1,drawtext=text='RANUWA LIVE':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=8[v]; [1:a]asetrate=44100*1.01,aresample=44100[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
            

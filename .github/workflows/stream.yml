name: Stream Touchcric Match via Chromium Capture

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Download Background Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

          curl -L -o bgmusic.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Start Virtual Display & Launch Puppeteer
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--disable-popup-blocking'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Block Ads and Extra Tabs
            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            await page.goto('https://new.touchcric.com/watch-pakistan-vs-sri-lanka-1st-odi-tri-series-live-cricket-streaming.htm', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 8000));

            await page.evaluate(() => {
              window.open = function() { return null; };
              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 0.9;
                video.play();
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 15

          # Picture-in-Picture Canvas + Color Modification + Custom Overlays
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -stream_loop -1 -i bgmusic.mp3 \
            -filter_complex "[0:v]crop=680:390:300:180,scale=960:540,eq=brightness=0.05:contrast=1.3:saturation=1.5:gamma=1.2,pad=1280:720:160:90:color=darkblue,drawtext=text=' LIVE CRICKET WATCH PARTY ':x=(w-tw)/2:y=30:fontsize=38:fontcolor=yellow:box=1:boxcolor=black@0.7:boxborderw=10,drawtext=text=' RANUWA LIVE ':x=30:y=h-50:fontsize=28:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=8[v]; [1:a]asetrate=44100*0.95,aresample=44100,volume=0.75[main_audio]; [2:a]volume=0.15[bg_audio]; [main_audio][bg_audio]amix=inputs=2:duration=first[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2200k -maxrate 2500k -bufsize 4500k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

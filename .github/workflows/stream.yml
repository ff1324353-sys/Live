name: Willow HD Anti-Copyright Streamer

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --break-system-packages yt-dlp

      - name: Start Protected Live Stream to Facebook
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          STREAM_URL: "http://tvsen5.aynascope.net/willowhd/index.m3u8"
        run: |
          echo "Bypassing server security and starting stream..."
          
          while true; do
            # yt-dlp හරහා Cloudflare / Token Bypassed Direct Real Link එකක් ලබා ගැනීම
            REAL_URL=$(yt-dlp --no-check-certificates --geo-bypass -g "$STREAM_URL" 2>/dev/null || echo "$STREAM_URL")
            
            if [ -z "$REAL_URL" ]; then
              REAL_URL="$STREAM_URL"
            fi

            echo "Connecting to live stream securely..."

            ffmpeg -user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -headers "Referer: http://tvsen5.aynascope.net/"$'\r\n'"Origin: http://tvsen5.aynascope.net"$'\r\n' \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -rw_timeout 15000000 \
            -fflags +genpts+discardcorrupt \
            -i "$REAL_URL" \
            -vf "hflip,scale=1280:720,eq=saturation=1.18:contrast=1.20:brightness=0.03,\
            drawbox=x=970:y=10:w=300:h=110:color=black@0.99:t=fill,\
            drawtext=text='LIVE MATCH':fontcolor=yellow:fontsize=22:x=1010:y=50,\
            drawbox=x=0:y=655:w=1280:h=50:color=black@0.8:t=fill,\
            drawtext=text='● EXCLUSIVE LIVE MATCH STREAMING - PLEASE FOLLOW':fontcolor=white:fontsize=16:x='1280-mod(t*120\, 1700)':y=670" \
            -af "asetrate=44100*1.05,aresample=44100,atempo=1/1.05" \
            -c:v libx264 -preset veryfast -tune zerolatency -g 50 \
            -b:v 2200k -maxrate 2800k -bufsize 5000k -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
            
            echo "Stream disconnected. Reconnecting in 3 seconds..."
            sleep 3
          done
          

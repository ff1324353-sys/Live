name: FB Live Sound Fixed Final

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Virtual Display, Browser & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils jq python3-pip
          pip3 install websocket-client

      - name: Start Live Stream Setup
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          TARGET_URL: "https://www.facebook.com/61582413664556/videos/867494799719403/?mibextid=rS40aB7S9Ucbxw6v"
        run: |
          # 1. Set the user-provided proxy directly
          SELECTED_PROXY="45.194.90.225:8080"
          PROXY_ARG="--proxy-server=http://$SELECTED_PROXY"
          echo "Using User-Provided Proxy: $SELECTED_PROXY"

          # 2. Start Virtual Display & PulseAudio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1
          sleep 3

          # 3. Launch Chromium with the specified proxy
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --mute-audio=false \
            $PROXY_ARG \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "${TARGET_URL}" &
          
          # Wait for page load and skip login dialogs
          sleep 12
          xdotool key Escape
          sleep 2
          
          # 4. Inject JavaScript directly into Chromium to find the video element and UNMUTE it!
          python3 -c '
          import urllib.request, json, time, urllib.error
          time.sleep(3)
          try:
              response = urllib.request.urlopen("http://localhost:9222/json")
              targets = json.loads(response.read().decode())
              ws_url = None
              for t in targets:
                  if "facebook.com" in t.get("url", ""):
                      ws_url = t.get("webSocketDebuggerUrl")
                      break
              if ws_url:
                  import websocket
                  ws = websocket.create_connection(ws_url)
                  js_code = """
                  document.querySelectorAll("video").forEach(v => {
                      v.muted = false;
                      v.volume = 1.0;
                      v.play();
                  });
                  const muteBtn = document.querySelector("div[aria-label*=\"Mute\"], div[aria-label*=\"Unmute\"]");
                  if(muteBtn) muteBtn.click();
                  """
                  msg = json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": js_code}})
                  ws.send(msg)
                  ws.close()
                  print("JS Unmute executed successfully!")
          except Exception as e:
              print("JS Injection note:", e)
          ' || true

          sleep 3

          # 5. Capture Screen & PulseAudio Stream (Original Size & Crop)
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f pulse -i default \
          -filter_complex "[0:v]crop=790:420:18:135,scale=1280:720,drawbox=x=12:y=12:w=125:h=42:color=black@0.95:t=fill,eq=brightness=0.06:contrast=1.15:saturation=1.25:gamma=1.1,drawtext=text='LIVE STREAM':x='(w-text_w)/2+70*sin(t)':y='(h-text_h)/2+30*cos(t)':fontsize=26:fontcolor=white@0.3:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf[vout];[1:a]asetrate=44100*1.05,aresample=44100,atempo=1/1.05[aout]" \
          -map "[vout]" -map "[aout]" \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -g 60 -r 30 -c:a aac -b:a 128k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
          

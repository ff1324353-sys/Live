name: FB Live Broadcast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librubberband-dev fonts-dejavu-core

      - name: Start Live Stream to Facebook
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          ffmpeg -fflags +genpts -re -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -i "http://tvsen5.aynascope.net/willowhd/index.m3u8" \
          -vf "crop=iw-60:ih-60:30:30,pad=iw+20:ih+20:10:10:black,drawbox=x=iw-220:y=20:w=180:h=60:color=black@0.9:t=fill,drawtext=text='SL vs PAK LIVE':x=(w-text_w)/2:y=(h-text_h)/2:fontsize=36:fontcolor=white@0.3:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf,eq=brightness=0.05:contrast=1.12:saturation=1.25:gamma=1.08,setpts=PTS/1.06,scale=1280:720" \
          -af "atempo=1.06,rubberband=pitch=1.12,highpass=f=200,equalizer=f=1000:width_type=h:width=200:g=-4,dynaudnorm" \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -g 60 -r 30 -c:a aac -b:a 128k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

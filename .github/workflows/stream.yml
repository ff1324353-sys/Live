name: Premium UI Direct Willow HD Stream to Facebook Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Download Crowd Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          
          # Crowd Noise Audio Track
          curl -L -o crowd_noise.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Start Streaming to Facebook Live
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          ffmpeg -y \
            -re -i "https://tvsen5.aynascope.net/willowhd/index.m3u8" \
            -stream_loop -1 -i crowd_noise.mp3 \
            -filter_complex \
            "[0:v]crop=iw*0.86:ih*0.86:iw*0.07:ih*0.07, \
             scale=1280:720, \
             eq=brightness=0.06:contrast=1.35:saturation=1.5:gamma=1.2, \
             unsharp=5:5:1.0:5:5:0.0, \
             drawbox=x=0:y=0:w=iw:h=18:color=black@1.0:t=fill, \
             drawbox=x=0:y=ih-18:w=iw:h=18:color=black@1.0:t=fill, \
             drawbox=x=20:y=20:w=260:h=50:color=red@0.85:t=fill, \
             drawbox=x=20:y=20:w=260:h=50:color=gold@1.0:t=4, \
             drawtext=text='RANU JR LIVE':x=35:y=31:fontsize=24:fontcolor=white:enable='gt(mod(t,12),4)', \
             drawtext=text='MATCH UPDATES':x='(w-tw)/2':y='h-th-25':fontsize=22:fontcolor=yellow@0.9:box=1:boxcolor=black@0.7:boxborderw=6[v]; \
             [0:a]asetrate=44100*0.94,aresample=44100,volume=0.85,equalizer=f=1000:width_type=h:width=200:g=-3[main_audio]; \
             [1:a]volume=0.18[bg_audio]; \
             [main_audio][bg_audio]amix=inputs=2:duration=first[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2300k -maxrate 2600k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

name: YouTube Live Streamer

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Non-Stop Anti-Copyright Live Stream to YouTube
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
        run: |
          echo "Starting Auto-Restarting FFmpeg Live Stream..."
          
          # while true loop එක නිසා FFmpeg එක Exit වුණත් auto ආයෙත් පටන් ගන්නවා
          while true; do
            echo "Launching FFmpeg Stream..."
            
            ffmpeg -headers "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -multiple_requests 1 \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -rw_timeout 15000000 \
            -fflags +discardcorrupt+genpts -probesize 50M -analyzeduration 20M \
            -i "https://tvsen6.aynaott.com/zv68oqPDu7MZZwmHhRxt/tracks-v1a1/mono.ts.m3u8" \
            -vf "scale=1280:720,eq=saturation=1.12:contrast=1.18,\
            drawbox=x=1060:y=15:w=300:h=160:color=black@0.98:t=fill,\
            drawtext=text='LIVE_24_7':fontcolor=yellow:fontsize=18:x=1100:y=40,\
            drawbox=x=0:y=665:w=1280:h=40:color=black@0.7:t=fill,\
            drawtext=text='● LIVE CRICKET MATCH STREAMING - ENJOY THE GAME':fontcolor=white:fontsize=16:x='1280-mod(t*120\, 1600)':y=675" \
            -af "volume=0" \
            -c:v libx264 -preset veryfast -tune zerolatency -fps_mode cfr -g 50 \
            -b:v 2200k -maxrate 2800k -bufsize 5000k -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_KEY"
            
            echo "Stream crashed or disconnected. Restarting in 3 seconds..."
            sleep 3
          done

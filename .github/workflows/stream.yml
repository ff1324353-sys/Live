name: FB Live Broadcast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librubberband-dev fonts-dejavu-core

      - name: Start Live Stream to Facebook
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          ffmpeg -fflags +genpts -re -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -i "http://tvsen5.aynascope.net/willowhd/index.m3u8" \
          -filter_complex "[0:v]crop=iw:ih-50:0:50,eq=brightness=0.06:contrast=1.15:saturation=1.3:gamma=1.1,setpts=PTS/1.07,scale=1280:720[main];[main]split[bg][fg];[bg]scale=1280:720,boxblur=20:10[blurred];[fg]scale=1100:618[small];[blurred][small]overlay=(W-w)/2:(H-h)/2,drawbox=x=iw-250:y=60:w=180:h=60:color=black@0.95:t=fill,drawtext=text=SL vs PAK LIVE:x=(w-text_w)/2:y=30:fontsize=32:fontcolor=white@0.4:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf[vout];[0:a]atempo=1.07,rubberband=pitch=1.07,highpass=f=250,lowpass=f=3800,volume=0.9,stereowiden=delay=20:feedback=0.3[aorig];anoisesrc=d=1:c=pink:a=0.01:s=44100[bgmusic];[aorig][bgmusic]amix=inputs=2:duration=first:dropout_transition=2[aout]" \
          -map "[vout]" -map "[aout]" \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2300k -maxrate 2300k -bufsize 4600k \
          -g 60 -r 30 -c:a aac -b:a 128k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

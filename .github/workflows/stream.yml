name: Stream Touchcric Match to Facebook via Chromium Capture

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Download Background Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core
          npm install puppeteer
          
          # Copyright walin rakenna background music eka download karaganeema
          curl -L -o bgmusic.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Start Virtual Display & Launch Puppeteer
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Ads nisa aluthen open wena tabs block kirima
            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            // Aluth Match Page Link eka
            await page.goto('https://footfytv.pro/watch/4527', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            // Tapmad server button eka hoyala click kirima saha video eka fullscreen kirima
            await page.evaluate(async () => {
              window.open = function() { return null; };

              // Server list eken 'Tapmad' kiyana button eka hoyala click kirima
              const buttons = Array.from(document.querySelectorAll('button, a, div.server-item, span'));
              const tapmadBtn = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('tapmad'));
              
              if (tapmadBtn) {
                tapmadBtn.click();
              }

              // Podi welawak deela video eka un-mute karala fullscreen kirima
              await new Promise(resolve => setTimeout(resolve, 3000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 18

          # FFmpeg streaming command eka (Fingerprint saha Watermark ekka)
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -stream_loop -1 -i bgmusic.mp3 \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.04:contrast=1.5:saturation=1.25:gamma=1.05,hue=h=22:s=1.1,noise=alls=15:allf=t+u,unsharp=5:5:0.8:3:3:0.4,fps=30,drawtext=text=' SPORT RANUWA ':x=w-tw-25:y=70:fontsize=42:fontcolor=white:box=1:boxcolor=red@0.9:boxborderw=18[v]; [1:a]asetrate=44100*0.94,aresample=44100,equalizer=f=1200:width_type=h:width=250:g=-7,volume=0.55[main_audio]; [2:a]volume=0.4[bg_audio]; [main_audio][bg_audio]amix=inputs=2:duration=first[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"

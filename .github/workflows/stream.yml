name: YouTube Live Streamer

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Dynamic Anti-Copyright Live Stream to YouTube
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
        run: |
          echo "Starting Advanced FFmpeg Live Stream with Dynamic Elements..."
          
          ffmpeg -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
          -fflags +discardcorrupt+genpts -probesize 50M -analyzeduration 20M \
          -i "https://tvsen6.aynaott.com/zv68oqPDu7MZZwmHhRxt/tracks-v1a1/mono.ts.m3u8" \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -filter_complex "[0:v]scale=1280:720,eq=saturation=1.12:contrast=1.18,\
          drawbox=x=1060:y=15:w=300:h=160:color=black@0.98:t=fill,\
          drawtext=text='LIVE_24_7':fontcolor=yellow:fontsize=18:x=1100:y=40,\
          drawbox=x=0:y=665:w=1280:h=40:color=black@0.7:t=fill,\
          drawtext=text='● LIVE CRICKET MATCH STREAMING - ENJOY THE GAME':fontcolor=white:fontsize=16:x='1280-mod(t*120\, 1600)':y=675[outv]" \
          -map "[outv]" -map 1:a \
          -c:v libx264 -preset ultrafast -tune zerolatency -fps_mode cfr -g 50 \
          -b:v 1000k -maxrate 1400k -bufsize 2800k -pix_fmt yuv420p \
          -c:a aac -b:a 128k -ar 44100 -ac 2 -shortest \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_KEY"

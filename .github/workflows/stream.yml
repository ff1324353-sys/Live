name: FB Live Broadcast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Start Live Stream to Facebook
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          ffmpeg -fflags +genpts -re -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -i "http://tvsen5.aynascope.net/willowhd/index.m3u8" \
          -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
          -filter_complex "[0:v]crop=iw-120:ih-120:60:60,rotate=0.015:c=black,eq=brightness=0.06:contrast=1.14:saturation=1.25:gamma=1.05,setpts=PTS/1.04,scale=1280:720[main];[main]split[bg][fg];[bg]boxblur=15:8[blurred];[fg]scale=1050:590[small];[blurred][small]overlay=(W-w)/2:(H-h)/2,drawbox=x=iw-240:y=50:w=190:h=50:color=black@0.9:t=fill,drawtext=text=SL vs PAK LIVE:x='(w-text_w)/2+100*sin(t)':y='(h-text_h)/2+50*cos(t)':fontsize=30:fontcolor=white@0.4:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf[vout]" \
          -map "[vout]" -map 1:a \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 1900k -maxrate 1900k -bufsize 3800k \
          -g 60 -r 30 -c:a aac -b:a 64k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
          

name: FB Live Auto Proxy Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser ffmpeg fonts-dejavu-core pulseaudio xdotool alsa-utils python3-pip
          pip3 install websocket-client requests

      - name: Start Live Stream Setup
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          TARGET_URL: "https://www.facebook.com/61582413664556/videos/867494799719403/?mibextid=rS40aB7S9Ucbxw6v"
        run: |
          echo "$FB_COOKIES" > cookies.txt

          # 1. Start Virtual Display & PulseAudio
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio -D --exit-idle-time=-1
          sleep 3

          # 2. Python script to find a working Sri Lanka proxy or fallback to direct
          PROXY_ARG=""
          python3 -c '
          import requests, os
          try:
              res = requests.get("https://api.proxyscrape.com/v2/?request=getproxies&protocol=http&country=LK&timeout=10000&simplify=true", timeout=5)
              if res.status_code == 200 and res.text.strip():
                  proxies = res.text.strip().split("\r\n")
                  if proxies:
                      with open("proxy.txt", "w") as f:
                          f.write(proxies[0])
          except Exception as e:
              print("Proxy fetch error:", e)
          ' || true

          if [ -f proxy.txt ]; then
            LK_PROXY=$(cat proxy.txt)
            echo "Using Sri Lanka Proxy: $LK_PROXY"
            PROXY_ARG="--proxy-server=http://$LK_PROXY"
          else
            echo "No proxy found, running direct."
          fi

          # 3. Launch Chromium with dynamic proxy
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --autoplay-policy=no-user-gesture-required \
            --mute-audio=false \
            $PROXY_ARG \
            --remote-debugging-port=9222 \
            --disable-dev-shm-usage \
            --start-fullscreen \
            --kiosk "${TARGET_URL}" &
          
          sleep 10
          xdotool key Escape
          sleep 2

          # 4. Inject JS to Unmute Video Automatically
          python3 -c '
          import urllib.request, json, time
          time.sleep(2)
          try:
              response = urllib.request.urlopen("http://localhost:9222/json")
              targets = json.loads(response.read().decode())
              ws_url = None
              for t in targets:
                  if "facebook.com" in t.get("url", ""):
                      ws_url = t.get("webSocketDebuggerUrl")
                      break
              if ws_url:
                  import websocket
                  ws = websocket.create_connection(ws_url)
                  js_code = """
                  document.querySelectorAll("video").forEach(v => {
                      v.muted = false;
                      v.volume = 1.0;
                      v.play();
                  });
                  """
                  msg = json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": js_code}})
                  ws.send(msg)
                  ws.close()
          except Exception as e:
              print(e)
          ' || true

          sleep 3

          # 5. Stream using Original Crop & Fullscreen settings
          ffmpeg -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
          -f pulse -i default \
          -filter_complex "[0:v]crop=790:420:18:135,scale=1280:720,drawbox=x=12:y=12:w=125:h=42:color=black@0.95:t=fill,eq=brightness=0.06:contrast=1.15:saturation=1.25:gamma=1.1,drawtext=text='LIVE STREAM':x='(w-text_w)/2+70*sin(t)':y='(h-text_h)/2+30*cos(t)':fontsize=26:fontcolor=white@0.3:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf[vout];[1:a]asetrate=44100*1.05,aresample=44100,atempo=1/1.05
          

name: Facebook Live Stream via yt-dlp

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-dejavu-core
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Stream YouTube Live directly to Facebook with Anti-Copyright Filters
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          # Direct YouTube URL
          YOUTUBE_URL="https://www.youtube.com/watch?v=n3qodO8ER_4"

          # Get direct stream link via yt-dlp and push to Facebook RTMP using FFmpeg with Filters
          yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" -g "$YOUTUBE_URL" | {
            read -r VIDEO_URL
            read -r AUDIO_URL || AUDIO_URL="$VIDEO_URL"

            ffmpeg -re -i "$VIDEO_URL" -i "$AUDIO_URL" \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.03:saturation=1.1,drawtext=text='RANUWA LIVE':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=8[v]; [1:a]asetrate=44100*1.01,aresample=44100[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
          }
          

name: FB Live Broadcast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librubberband-dev

      - name: Start Live Stream to Facebook
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          ffmpeg -fflags +genpts -re -i "http://tvsen5.aynascope.net/willowhd/index.m3u8" \
          -vf "crop=iw-20:ih-20:10:10,drawbox=x=20:y=20:w=180:h=60:color=black@0.9:t=fill,eq=brightness=0.03:contrast=1.05:saturation=1.1,scale=1280:720" \
          -af "rubberband=pitch=1.02,equalizer=f=1000:width_type=h:width=200:g=-3,dynaudnorm" \
          -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -g 60 -r 30 -c:a aac -b:a 128k -ar 44100 \
          -max_interleave_delta 0 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

name: Stream Willow HD via Chromium Capture

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            chromium-browser \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core
          npm install puppeteer-core

      - name: Start Virtual Display & Launch Puppeteer
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          # 1. Start Virtual Framebuffer
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true

          # 2. Write Puppeteer Script
          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/chromium-browser',
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--disable-blink-features=AutomationControlled'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Create simple HTML player for M3U8 Stream
            const playerHtml = `
              <!DOCTYPE html>
              <html>
              <head>
                <style>
                  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: black; }
                  video { width: 100vw; height: 100vh; object-fit: cover; }
                </style>
                <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
              </head>
              <body>
                <video id="video" autoplay muted controls></video>
                <script>
                  var video = document.getElementById('video');
                  var videoSrc = 'https://tvsen5.aynaott.com/willowhd/index.m3u8';
                  if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                      video.play();
                    });
                  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoSrc;
                    video.addEventListener('loadedmetadata', function() {
                      video.play();
                    });
                  }
                </script>
              </body>
              </html>
            `;

            await page.setContent(playerHtml);
            console.log("Player Loaded and Video Playing!");
          })();
          EOF

          # Run Puppeteer script in background
          node launch.js > /dev/null 2>&1 &

          # Wait for stream to load
          sleep 10

          # 3. Capture Screen & Stream to FB Live with Copyright Filters
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -i default \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.03:saturation=1.1,drawtext=text='RANUWA LIVE':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=8[v]; [1:a]asetrate=44100*1.01,aresample=44100[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
            
